# GitHub Pages serves this app from branch gh-pages, which had stopped following the default branch
# (03.11.2026: the live page was still the July version). On every push, index.html is copied there.
# taba.html is NOT copied: the gh-pages copy has the requirements extraction that the default branch lacks.
name: sync index.html to Pages
on:
  push:
    branches: [claude/architect-coverage-calculator-ozjyul]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Copy index.html and push when it changed
        run: |
          cp src/index.html site/index.html
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || { git commit -q -m "index.html from ${GITHUB_SHA}"; git push -q origin gh-pages; }
