# GitHub Pages serves this app from branch gh-pages, which had stopped following the default branch
# (03.11.2026: the live page was still the July version). On every push, the app files are copied there.
# 05.11.2026: taba.html from gh-pages was merged into the default branch, so all three files are copied.
name: sync the app to Pages
on:
  push:
    branches: [claude/architect-coverage-calculator-ozjyul]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Copy the app and push when it changed
        run: |
          cp src/index.html src/taba.html src/app.css site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html taba.html app.css
          git diff --cached --quiet || { git commit -q -m "app from ${GITHUB_SHA}"; git push -q origin gh-pages; }
